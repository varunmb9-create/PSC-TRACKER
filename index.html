<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSC TRACKER</title>

<!-- Web App / Standalone Installation Meta -->
<meta name="theme-color" content="#0b1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PSC Tracker">

<!-- Custom App Icon Links -->
<link rel="icon" type="image/png" href="psc_icon.png">
<link rel="apple-touch-icon" href="psc_icon.png">

<!-- Inline Web App Manifest for Direct "Install App" Feature -->
<link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22PSC%20TRACKER%22%2C%22short_name%22%3A%22PSC%20Tracker%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b1120%22%2C%22theme_color%22%3A%22%230b1120%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22psc_icon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1120; color: #f8fafc; padding: 14px;
    padding-bottom: 60px;
  }

  /* Tap-to-Start Splash Overlay */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #0b1120; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .splash-btn {
    margin-top: 22px; padding: 12px 30px; background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff; font-weight: 700; border-radius: 30px; font-size: 0.95rem;
    box-shadow: 0 4px 20px rgba(56,189,248,0.4); border: none; outline: none;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  header { 
    text-align: center; margin: 10px auto 16px auto; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .app-logo {
    width: 85px; height: 85px; border-radius: 18px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 8px;
    border: 1px solid #334155; object-fit: cover;
  }
  h1 { font-size: 1.35rem; color: #fbbf24; font-weight: 800; letter-spacing: 0.5px; }
  p.sub { font-size: 0.8rem; color: #94a3b8; margin-top: 3px; }
  
  .cards-container { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
  .day-card {
    background: #1e293b; border-radius: 12px; padding: 14px;
    border: 1px solid #334155; box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px;
  }
  .day-title { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }
  .day-progress { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
  
  .tasks-list { display: flex; flex-direction: column; gap: 9px; }
  .task-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f172a; padding: 10px 12px; border-radius: 8px;
  }
  .task-left { display: flex; align-items: center; gap: 10px; }
  
  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 25px; height: 25px; border: 2px solid #64748b;
    border-radius: 6px; outline: none; cursor: pointer;
    display: grid; place-content: center; transition: all 0.2s;
  }
  input[type="checkbox"]:checked {
    background-color: #22c55e; border-color: #22c55e;
  }
  input[type="checkbox"]:checked::before {
    content: "✓"; font-size: 15px; font-weight: 900; color: #fff;
  }

  .label-text { font-size: 0.86rem; font-weight: 500; }
  .badge-study { color: #4ade80; }
  .badge-d1 { color: #38bdf8; }
  .badge-d5 { color: #f472b6; }
  .badge-d15 { color: #fb923c; }
  .time-tag { font-size: 0.7rem; color: #64748b; background: #1e293b; padding: 2px 6px; border-radius: 4px; }

  #confetti-canvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 999;
  }
</style>
</head>
<body>

<!-- Splash Screen for Clean Audio Launch -->
<div id="splash-screen" onclick="startAppWithSound()">
  <img src="psc_icon.png" alt="Logo" class="app-logo" style="width:105px; height:105px; border-radius:22px;" onerror="this.style.display='none'">
  <h1 style="margin-top:10px;">PSC TRACKER</h1>
  <p class="sub">1-5-15 Retention System</p>
  <button class="splash-btn">⚡ Launch Tracker</button>
</div>

<canvas id="confetti-canvas"></canvas>

<header>
  <img src="psc_icon.png" alt="PSC Tracker Icon" class="app-logo" onerror="this.style.display='none'">
  <h1>PSC TRACKER</h1>
  <p class="sub">1-5-15 Retention Engine • Daily 8 Topics</p>
</header>

<div class="cards-container" id="cards-container"></div>

<script>
  const container = document.getElementById('cards-container');
  let cardsHtml = '';

  for (let i = 1; i <= 90; i++) {
    cardsHtml += `
      <div class="day-card" id="card_d${i}">
        <div class="card-header">
          <span class="day-title">Day ${i}</span>
          <span class="day-progress" id="prog_d${i}">0/4 done</span>
        </div>
        <div class="tasks-list">
          <div class="task-row">
            <div class="task-left">
              <input type="checkbox" id="d${i}_study" data-day="${i}" data-read="Day ${i}. Study New Eight Topics. Done!">
              <label class="label-text badge-study">Study New 8 Topics</label>
            </div>
            <span class="time-tag">Day ${i}</span>
          </div>

          ${i >= 2 ? `
          <div class="task-row">
            <div class="task-left">
              <input type="checkbox" id="d${i}_d1" data-day="${i}" data-read="Lock. Day ${i-1} Quick Scan. Done!">
              <label class="label-text badge-d1">Lock: Yesterday's Scan</label>
            </div>
            <span class="time-tag">Day ${i-1}</span>
          </div>` : ''}

          ${i >= 5 ? `
          <div class="task-row">
            <div class="task-left">
              <input type="checkbox" id="d${i}_d5" data-day="${i}" data-read="Blurt. Day ${i-4} Walk Recall. Done!">
              <label class="label-text badge-d5">Blurt: 5-Day Walk Recall</label>
            </div>
            <span class="time-tag">Day ${i-4}</span>
          </div>` : ''}

          ${i >= 15 ? `
          <div class="task-row">
            <div class="task-left">
              <input type="checkbox" id="d${i}_d15" data-day="${i}" data-read="Filter. Day ${i-14} Quiz. Done!">
              <label class="label-text badge-d15">Filter: 10 MCQs Quiz</label>
            </div>
            <span class="time-tag">Day ${i-14}</span>
          </div>` : ''}
        </div>
      </div>
    `;
  }
  container.innerHTML = cardsHtml;

  // --- HARDWARE COMPATIBLE STARTUP CHIME ---
  function startAppWithSound() {
    const splash = document.getElementById('splash-screen');
    splash.style.opacity = '0';
    setTimeout(() => { splash.style.display = 'none'; }, 400);

    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      ctx.resume().then(() => {
        const notes = [
          { f: 440.00, start: 0.00, dur: 0.4 },
          { f: 554.37, start: 0.08, dur: 0.4 },
          { f: 659.25, start: 0.16, dur: 0.5 },
          { f: 880.00, start: 0.25, dur: 0.8 }
        ];

        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.start);

          gain.gain.setValueAtTime(0.01, ctx.currentTime + n.start);
          gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + n.start + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.start + n.dur);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + n.start);
          osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
        });
      });
    } catch (e) {
      console.log(e);
    }
  }

  // TTS Read Aloud
  function readAloud(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Confetti Animation
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let confettiParticles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerConfetti() {
    confettiParticles = [];
    const colors = ['#38bdf8', '#4ade80', '#fbbf24', '#f472b6', '#a855f7'];
    for (let i = 0; i < 40; i++) {
      confettiParticles.push({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        r: Math.random() * 6 + 3,
        dx: (Math.random() - 0.5) * 10,
        dy: (Math.random() - 0.7) * 12,
        color: colors[Math.floor(Math.random() * colors.length)],
        opacity: 1
      });
    }
    animateConfetti();
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    confettiParticles.forEach(p => {
      p.x += p.dx;
      p.y += p.dy;
      p.dy += 0.4;
      p.opacity -= 0.02;
      if (p.opacity > 0) {
        active = true;
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }
    });
    if (active) requestAnimationFrame(animateConfetti);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function updateCardProgress(day) {
    const card = document.getElementById(`card_d${day}`);
    const boxes = card.querySelectorAll('input[type="checkbox"]');
    const checked = card.querySelectorAll('input[type="checkbox"]:checked').length;
    const progLabel = document.getElementById(`prog_d${day}`);
    progLabel.textContent = `${checked}/${boxes.length} done`;
    if (checked === boxes.length && boxes.length > 0) {
      progLabel.style.color = '#4ade80';
    } else {
      progLabel.style.color = '#94a3b8';
    }
  }

  document.querySelectorAll('input[type="checkbox"]').forEach(box => {
    box.checked = localStorage.getItem('psc_mobi_' + box.id) === 'true';
    const day = box.getAttribute('data-day');
    updateCardProgress(day);

    box.addEventListener('change', () => {
      localStorage.setItem('psc_mobi_' + box.id, box.checked);
      updateCardProgress(day);
      if (box.checked) {
        triggerConfetti();
        const textToRead = box.getAttribute('data-read');
        readAloud(textToRead);
      }
    });
  });
</script>
</body>
</html>
